name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance 需要 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 仓库内 .npmrc 指向 npmmirror，发布必须显式覆盖为官方源
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lib/ 不入库，发布前必须有真实构建产物
      - name: Build package
        run: pnpm run build

      - name: Verify release tag matches package version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg_version  tag=$tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $pkg_version 不一致"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
